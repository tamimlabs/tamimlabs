name: Posts
# 🎬 Auto-updates README between markers:
#   <!-- YOUTUBE:START --> ... <!-- YOUTUBE:END -->
#   <!-- BLOG-POST-LIST:START --> ... <!-- BLOG-POST-LIST:END -->
# Setup: replace CHANNEL_ID / FEED_URL below, then run once manually.

on:
  schedule:
    - cron: "0 8 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          max_post_count: "5"
          # --- YouTube via RSS (channel: @tamimlabs) ---
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCv4McnzY0Zp0jdxJmZMToEg"
          comment_tag_name: "YOUTUBE"
          # --- Add more feeds comma-separated if needed ---
          # feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCv4McnzY0Zp0jdxJmZMToEg,https://example.com/feed.xml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
