name: Metrics
# 📊 Generates metrics.svg on main via lowlighter/metrics.
# README embeds: https://raw.githubusercontent.com/tamimlabs/tamimlabs/main/metrics.svg
# Setup: create a classic PAT (read:user, repo) and save it as repo secret METRICS_TOKEN.

on:
  schedule:
    - cron: "0 6 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: tamimlabs
          template: classic
          filename: metrics.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          config_timezone: Asia/Dhaka
